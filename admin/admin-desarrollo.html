<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://sdk.mercadopago.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.mercadopago.com http://localhost:3000 https://api.monsite.cl; frame-src 'self' https://monsite-85424.firebaseapp.com https://accounts.google.com https://www.mercadopago.com https://www.mercadopago.cl https://www.mercadolibre.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.mercadopago.com https://www.mercadopago.cl; style-src-attr 'unsafe-inline';">
    <title>Desarrollo - Monsite Admin</title>
    <script src="../js/admin/admin-auth-guard.js"></script>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <script src="../js/admin/admin-theme.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css?v=20260813a">
    <link rel="stylesheet" href="../css/mobile-polish.css?v=20260810c">
</head>
<body>
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-top">
                <div class="admin-logo">
                    <img src="../images/logo.jpg" alt="Monsite Admin">
                    <h2>Panel Admin</h2>
                </div>
                <button id="adminDesarrolloLogoutBtn" class="logout-btn logout-btn-compact" type="button">Salir</button>
            </div>

            <div class="theme-toggle-container">
                <button class="theme-toggle-btn" id="themeToggle">
                    <span class="theme-slider">
                        <span class="theme-knob"></span>
                    </span>
                    <span class="theme-text">Modo Oscuro</span>
                </button>
            </div>

            <nav class="admin-nav">
                <a href="admin.html" class="nav-item">Dashboard</a>
                <a href="admin-products.html" class="nav-item">Productos</a>
                <a href="admin-discounts.html" class="nav-item">Descuentos</a>
                <a href="admin-orders.html" class="nav-item">Ordenes</a>
                <a href="admin-desarrollo.html" class="nav-item active">Desarrollo</a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="admin-welcome">
                    <h1>Desarrollo</h1>
                    <p>Estado de las funciones que todavía están en construcción</p>
                </div>
                <div class="admin-actions">
                    <button id="adminDesarrolloViewStoreBtn" class="btn-secondary">Ver Tienda</button>
                </div>
            </header>

            <div class="recent-activity dev-feature-card">
                <h3>Contenedor de IA: Análisis de cabello <span class="status-badge" id="hairAnalysisStatusBadge" style="background:#6366f1;">Visible</span></h3>

                <div class="form-group">
                    <label for="hairAnalysisVisibilityState">Estado</label>
                    <select id="hairAnalysisVisibilityState">
                        <option value="visible">Visible</option>
                        <option value="solo_admin">Visible solo admin</option>
                        <option value="oculto">No visible</option>
                    </select>
                </div>

                <button type="button" class="btn-primary" id="hairAnalysisSaveBtn">Guardar cambios</button>
            </div>
        </main>
    </div>

    <script type="module" src="../js/config/firebase-config.js"></script>
    <script src="../js/services/firebase-data.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/admin/admin-logout.js"></script>
    <script src="../js/admin/admin-notifications.js"></script>
    <script src="../js/admin/admin-desarrollo.js"></script>
    <script src="../js/ui/menu.js"></script>
</body>
</html>
