<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://sdk.mercadopago.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://www.gstatic.com https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.mercadopago.com http://localhost:3000 https://api.monsite.cl https://*.ngrok-free.dev; frame-src 'self' https://monsite-85424.firebaseapp.com https://accounts.google.com https://www.mercadopago.com https://www.mercadopago.cl https://www.mercadolibre.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.mercadopago.com https://www.mercadopago.cl; style-src-attr 'unsafe-inline';">
    <title>Restablecer Contrase&times;a - Monsite Belleza</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/reset-password.css?v=20260813a">
    <link rel="stylesheet" href="css/mobile-polish.css?v=20260810c">
</head>
<body>
    <div class="reset-wrapper">
        <!-- Header con logo -->
        <div class="reset-header">
            <img src="images/logo.jpg" alt="Monsite Logo" class="logo">
            <div>
                <h1>Monsite</h1>
                <p class="brand">Belleza & Cuidado Capilar</p>
            </div>
        </div>

        <!-- Card principal -->
        <div class="reset-card">
            <p class="reset-card-subtitle">?? <strong>Restablecer Contrase&times;a</strong></p>
            <p class="reset-card-subtitle">Ingresa una nueva contrase&times;a segura para tu cuenta</p>

            <!-- Mensajes de error/&times;xito -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Requisitos -->
            <div class="reset-requirements">
                <div class="reset-requirements-title">Requisitos</div>
                <div>? M&times;nimo 6 caracteres</div>
                <div>? Las 2 contrase&times;as deben ser id&times;nticas</div>
            </div>

            <!-- Formulario -->
            <form id="resetPasswordForm">
                <!-- Primera contrase&times;a -->
                <div class="form-group">
                    <label for="newPassword">Nueva Contrase&times;a</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        required 
                        placeholder="Ingresa tu nueva contrase&times;a"
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <!-- Confirmar contrase&times;a -->
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contrase&times;a</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        required 
                        placeholder="Repite la contrase&times;a"
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <div class="match-indicator">
                        <small id="matchMessage">Las contrase&times;as coinciden perfectamente</small>
                        <small id="noMatchMessage">Las contrase&times;as no coinciden</small>
                    </div>
                </div>

                <!-- Bot&times;n de env&times;o -->
                <button type="submit" class="reset-btn" id="submitBtn">
                    Cambiar Contrase&times;a
                </button>
            </form>

            <!-- Volver a login -->
            <div class="back-to-login">
                <a href="login.html">? Volver a Iniciar Sesi&times;n</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/config/firebase-config.js"></script>
    <script src="js/pages/reset-password.js"></script>
</body>
</html>
